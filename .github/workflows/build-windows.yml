name: Build Windows EXE

# Builds a ready-to-run autopodcast.exe on a GitHub-hosted Windows runner,
# so a Windows .exe never has to be built by hand. The finished build is
# attached to the run as a downloadable artifact.

on:
  push:
    branches:
      - main
      - claude/release-build
  workflow_dispatch:        # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build.spec --distpath _build/dist --workpath _build/build -y

      - name: Bundle ffmpeg
        shell: cmd
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          tar -xf ffmpeg.zip --strip-components=2 -C _build\dist\autopodcast "ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe" "ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe"

      - name: Smoke test
        shell: cmd
        run: _build\dist\autopodcast\autopodcast.exe --help

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopodcast-windows
          path: _build/dist/autopodcast/
          if-no-files-found: error
